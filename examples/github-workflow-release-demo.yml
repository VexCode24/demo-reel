# Copy into your repo as .github/workflows/release-demo.yml
# Builds a narrated demo MP4 on release and attaches it to the GitHub Release.

name: Release demo video

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  demo-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: mdscaff/demo-reel/.github/actions/build@main
        with:
          config: demo-reel.yaml
          tts: edge
          validate: "true"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*.mp4
