project_name: Demo Reel Example

server:
  host: 127.0.0.1
  port: 8899
  command:
    - python
    - -m
    - uvicorn
    - app:app
    - --host
    - "127.0.0.1"
    - --port
    - "{port}"
  health_path: /healthz
  demo_path: /demo?record=1&duration={duration}
  cwd: examples/minimal-fastapi

narration:
  file: examples/minimal-fastapi/narration.txt
  tts: edge

capture:
  fps: 24
  viewport_width: 1280
  viewport_height: 720

output:
  dir: dist
  filename: demo_reel_example.mp4
