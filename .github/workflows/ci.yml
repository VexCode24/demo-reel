name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,capture]"
      - run: ruff check demo_reel tests
      - run: pytest -q

  example-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[capture]" fastapi uvicorn
      - run: python -m playwright install chromium
      - run: demo-reel build --config demo-reel.yaml --validate
      - uses: actions/upload-artifact@v4
        with:
          name: example-demo-mp4
          path: dist/demo_reel_example.mp4
